<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style-gg.css">
    <title>Editar Visita - GVP / COLIH</title>
    <style>
        .card-container {
            background-color: #ffffff;
            max-width: 800px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-title {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .btn-nav {
            display: inline-block;
            padding: 8px 16px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-nav:hover { background-color: #5a6268; }
        .form-table {
            width: 100%;
            border: none;
        }
        .form-table td {
            border: none;
            padding: 8px 5px;
            vertical-align: middle;
        }
        .form-table label {
            font-weight: 600;
            color: #444;
        }
        .btn-submit {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover { background-color: #e0a800; }
        .alert {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="card-container">
        <a href="lista.html" class="btn-nav">📋 Cancelar e Voltar</a>
        <h2 class="header-title" id="tituloEditar">✏️ Editar Visita</h2>

        <!-- Mensagem de Feedback -->
        <div id="mensagemFeedback" class="alert"></div>

        <!-- Formulário de Edição -->
        <form id="formEditarVisita">
            <input type="hidden" id="visitaId" name="visitaId">

            <table class="form-table">
                <tr>
                    <td width="40%"><label for="paciente">Nome Completo do Paciente:</label></td>
                    <td><input class="input-rebaixado" type="text" id="paciente" name="paciente" required></td>
                </tr> 
                <tr>
                    <td><label for="responsavel">Nome do Pai/Mãe ou Responsável Legal:</label></td>
                    <td><input class="input-rebaixado" type="text" id="responsavel" name="responsavel"></td>
                </tr> 
                <tr>
                    <td><label for="idade">Idade do(a) Paciente:</label></td>
                    <td><input class="input-rebaixado" type="number" id="idade" name="idade" min="0"></td>
                </tr>    
                <tr>
                    <td><label for="visita">Data da Visita GVP:</label></td>
                    <td><input class="input-rebaixado" type="date" id="visita" name="visita" required></td>
                </tr>  
                <tr>
                    <td><label for="hospital">Hospital:</label></td>
                    <td><input class="input-rebaixado" type="text" id="hospital" name="hospital"></td>
                </tr>  
                <tr>
                    <td><label for="medico">Nome do Médico(a) Especialidade:</label></td>
                    <td><input class="input-rebaixado" type="text" id="medico" name="medico"></td>
                </tr>  
                <tr>
                    <td><label for="procedimento">Procedimento:</label></td>
                    <td><input class="input-rebaixado" type="text" id="procedimento" name="procedimento"></td>
                </tr>  
                <tr>
                    <td><label for="cidade">Cidade:</label></td>
                    <td><input class="input-rebaixado" type="text" id="cidade" name="cidade"></td>
                </tr>
                <tr>
                    <td><label for="congregacao">Congregação:</label></td>
                    <td><input class="input-rebaixado" type="text" id="congregacao" name="congregacao"></td>
                </tr>
                <tr>
                    <td><label for="batizado">O Paciente é Batizado?:</label></td>
                    <td>
                        <select id="batizado" name="batizado" style="width: 100%; height: 35px; border-radius: 8px; padding: 5px;">
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="telpaciente">Paciente - (Número):</label></td>
                    <td><input class="input-rebaixado" type="text" id="telpaciente" name="telpaciente"></td>
                </tr>  
                <tr>
                    <td><label for="telfamiliar">Familiar - (Nome, Número e Parentesco):</label></td>
                    <td><input class="input-rebaixado" type="text" id="telfamiliar" name="telfamiliar"></td>
                </tr> 
                <tr>
                    <td><label for="telacompanhante">Acompanhante - (Nome e Número):</label></td>
                    <td><input class="input-rebaixado" type="text" id="telacompanhante" name="telacompanhante"></td>
                </tr>  
                <tr>
                    <td><label for="dpa">DPA em dia, bom estado e atualizado?:</label></td>
                    <td>
                        <select id="dpa" name="dpa" style="width: 100%; height: 35px; border-radius: 8px; padding: 5px;">
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                        </select>
                    </td>
                </tr>  
                <tr>
                    <td><label for="nomegvp">Nome do GVP que finalizou a visita:</label></td>
                    <td><input class="input-rebaixado" type="text" id="nomegvp" name="nomegvp"></td>
                </tr>  
                <tr>
                    <td><label for="hoje">Data do Preenchimento do Formulário:</label></td>
                    <td><input class="input-rebaixado" type="date" id="hoje" name="hoje" required></td>
                </tr>	
                <tr>
                    <td colspan="2" style="text-align: center; padding-top: 15px;">
                        <button type="submit" class="btn-submit">💾 Salvar Alterações</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <!-- Scripts JavaScript -->
    <script src="js/api.js"></script>
    <script src="js/editar.js"></script>
</body>
</html>

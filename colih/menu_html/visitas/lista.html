<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style-gg.css">
    <title>Lista de Visitas - GVP / COLIH</title>
    <style>
        .container-lista {
            max-width: 1000px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .header-title {
            color: #333;
            font-size: 24px;
            margin: 0;
        }
        .btn-novo {
            background-color: #28a745;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-novo:hover { background-color: #218838; }
        
        .tabela-visitas {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .tabela-visitas th, .tabela-visitas td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .tabela-visitas th {
            background-color: #f4f6f8;
            color: #333;
            font-weight: 700;
        }
        .tabela-visitas tr:hover { background-color: #f9f9f9; }

        .btn-acao {
            display: inline-block;
            padding: 6px 12px;
            margin: 2px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-detalhes { background-color: #17a2b8; color: white; }
        .btn-detalhes:hover { background-color: #138496; }
        .btn-editar { background-color: #ffc107; color: #212529; }
        .btn-editar:hover { background-color: #e0a800; }
        .btn-excluir { background-color: #dc3545; color: white; }
        .btn-excluir:hover { background-color: #c82333; }

        .status-empty {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 16px;
        }
        .alert {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container-lista">
        <div class="header-box">
            <h2 class="header-title">📋 Lista de Visitas - GVP</h2>
            <a href="index.html" class="btn-novo">➕ Nova Visita</a>
        </div>

        <div id="mensagemFeedback" class="alert"></div>

        <!-- Tabela de Registros -->
        <table class="tabela-visitas">
            <thead>
                <tr>
                    <th width="8%">ID</th>
                    <th width="25%">Paciente</th>
                    <th width="20%">Hospital</th>
                    <th width="15%">Data Visita</th>
                    <th width="15%">GVP</th>
                    <th width="17%" style="text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabelaVisitas">
                <tr>
                    <td colspan="6" class="status-empty">Carregando visitas do banco de dados...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Scripts JavaScript -->
    <script src="js/api.js"></script>
    <script src="js/lista.js"></script>
</body>
</html>
